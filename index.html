<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: "Segoe UI", Arial, sans-serif; background: #12161c; color: #e6e6e6; display: flex; flex-direction: column; }

  .topo { display: flex; align-items: center; gap: 16px; padding: 10px 16px; background: #1b2129; border-bottom: 1px solid #2b333d; flex-wrap: wrap; }
  .marca { font-size: 17px; white-space: nowrap; }
  .marca small { color: #8b96a3; margin-left: 6px; }
  .progresso { flex: 1; min-width: 180px; display: flex; align-items: center; gap: 10px; }
  #placar { font-weight: bold; white-space: nowrap; }
  .barra { flex: 1; height: 10px; background: #2b333d; border-radius: 5px; overflow: hidden; }
  #barra-fill { height: 100%; width: 0; background: linear-gradient(90deg, #43a047, #fdd835); transition: width .4s; }
  .acoes button { font-size: 15px; padding: 8px 14px; border: none; border-radius: 6px; cursor: pointer; margin-left: 6px; }
  #btn-rodar { background: #43a047; color: #fff; font-weight: bold; }
  #btn-rodar small { opacity: .75; font-weight: normal; }
  #btn-reset { background: #3a434e; color: #e6e6e6; }
  #modo-prof { background: #8e24aa; color: #fff; padding: 4px 10px; border-radius: 4px; font-size: 13px; font-weight: bold; }

  .area { flex: 1; display: flex; min-height: 0; }
  .esq { flex: 1.25; display: flex; flex-direction: column; min-width: 0; border-right: 1px solid #2b333d; }
  .dir { flex: 1; display: flex; align-items: center; justify-content: center; padding: 14px; background: #0d1015; min-width: 0; }

  #passos { list-style: none; margin: 0; padding: 8px 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; background: #161b22; border-bottom: 1px solid #2b333d; }
  #passos li { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; font-size: 14px; }
  #passos li.feito { background: #1d3320; color: #a5d6a7; }
  #passos li.extra .titulo { color: #ffd54f; }
  #passos li.extra.feito .titulo { color: #a5d6a7; }
  #passos .status { width: 20px; text-align: center; }
  #passos .titulo { flex: 1; }
  #passos .falta { display: block; font-size: 12px; color: #ffb74d; }

  .abas { display: flex; gap: 2px; background: #161b22; padding: 0 8px; }
  .aba { padding: 7px 14px; font-size: 13px; font-family: Consolas, monospace; color: #8b96a3; background: transparent; border: none; border-bottom: 2px solid transparent; cursor: pointer; }
  .aba.ativa { color: #e6e6e6; border-bottom-color: #fdd835; background: #0f1318; }
  .aviso-leitura { font-size: 12px; color: #ffb74d; padding: 4px 14px; background: #2a2210; display: none; }
  .aviso-leitura.visivel { display: block; }

  .editor { flex: 1; min-height: 0; position: relative; }
  .editor .CodeMirror { position: absolute; inset: 0; height: auto; font-family: Consolas, "Courier New", monospace; font-size: 15px; line-height: 22px; }
  .CodeMirror-lint-tooltip { font-family: "Segoe UI", Arial, sans-serif; font-size: 14px; max-width: 420px; z-index: 50; }
  .CodeMirror-hints { font-family: Consolas, monospace; font-size: 14px; z-index: 50; }
  .CodeMirror-matchingtag { background: rgba(255, 255, 255, .10) !important; }
  .CodeMirror-matchingbracket { color: #fdd835 !important; text-decoration: underline; }

  #problemas { background: #161b22; border-top: 1px solid #2b333d; max-height: 150px; overflow: auto; font-size: 14px; }
  #problemas .cab { padding: 6px 14px; font-weight: bold; color: #8b96a3; position: sticky; top: 0; background: #161b22; }
  #problemas .cab.tem { color: #ff8a80; }
  #problemas .cab.ok { color: #a5d6a7; }
  #problemas .item { display: flex; gap: 10px; padding: 5px 14px; cursor: pointer; border-top: 1px solid #1f262e; }
  #problemas .item:hover { background: #1f262e; }
  #problemas .ln { color: #64b5f6; white-space: nowrap; min-width: 62px; }
  #problemas .item b { color: #fff; }

  .celular { width: 100%; max-width: 400px; height: 100%; max-height: 760px; border: 10px solid #2b333d; border-radius: 28px; overflow: hidden; background: #fff; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  #app { width: 100%; height: 100%; border: none; display: block; background: #fff; }


  #vitoria { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #fdd835; color: #222; padding: 14px 22px; border-radius: 10px; font-size: 17px; font-weight: bold; box-shadow: 0 6px 24px rgba(0,0,0,.4); text-align: center; cursor: pointer; }

  body.modo-app .topo, body.modo-app .esq, body.modo-app #vitoria { display: none !important; }
  body.modo-app .dir { padding: 0; background: #fff; }
  body.modo-app .celular { max-width: none; max-height: none; border: none; border-radius: 0; box-shadow: none; }

  @media (max-width: 900px) {
    .area { flex-direction: column; }
    .esq { min-height: 60vh; border-right: none; }
    .dir { min-height: 560px; }
    #passos { grid-template-columns: 1fr; }
  }
</style>

// banco.js: um "fetch simplificado" para conversar com a API do banco de dados
//
// No mundo real, o fetch é assim:
//
//   let resposta = await fetch(url, { method: "POST", body: JSON.stringify(dados) });
//   let json = await resposta.json();
//
// Para a aula, este arquivo deixa o fetch mais simples:
//
//   await fetch(API, "POST", reserva);       → envia a reserva para a API
//   let lista = await fetch(API, "GET");     → recebe a lista de reservas, já arrumada
//
// O fetch normal continua funcionando. Este só entra em ação
// quando o 2º item é um texto: "GET", "POST"...

(function () {
  const fetchDeVerdade = window.fetch.bind(window);
  window.__arenaBanco = true;
  window.__arenaGetOk = false;
  window.__arenaUltimaLista = [];

  window.fetch = async function (url, verbo, dados) {
    if (typeof verbo !== "string") return fetchDeVerdade(url, verbo);   // jeito normal

    verbo = verbo.toUpperCase();
    const opcoes = { method: verbo };
    if (dados !== undefined) opcoes.body = JSON.stringify(arrumarReserva(dados));

    const resposta = await fetchDeVerdade(url, opcoes);       // aqui acontece o fetch de verdade
    if (!resposta.ok) throw new Error("A API respondeu com erro " + resposta.status);
    const json = await resposta.json();                       // texto JSON → objeto JavaScript

    if (verbo === "GET") {
      const lista = virarLista(json);
      window.__arenaGetOk = true;
      window.__arenaUltimaLista = lista;
      return lista;
    }
    return json;
  };

  // O banco (Firebase) devolve { "id1": {...}, "id2": {...} }.
  // Aqui viramos uma lista [ {...}, {...} ], em ordem de data e horário.
  function virarLista(json) {
    return Object.values(json || {})
      .map(r => ({
        nome: limpar(r.nome),
        quadra: nomeDaQuadra(r.quadra),
        data: limpar(r.data),
        horario: limpar(r.horario)
      }))
      .sort((a, b) => (a.data + a.horario).localeCompare(b.data + b.horario));
  }

  // Deixa a reserva no formato que o banco aceita
  function arrumarReserva(r) {
    return {
      nome: limpar(r.nome).slice(0, 30) || "Anônimo",
      quadra: chaveDaQuadra(r.quadra),
      data: limpar(r.data).slice(0, 10) || hoje(),
      horario: limpar(r.horario).slice(0, 8),
      criadaEm: Date.now()
    };
  }

  // Segurança: tira < > e aspas, para ninguém colocar código no nome
  function limpar(texto) {
    return String(texto || "").replace(/[<>"'`]/g, "").trim();
  }

  // "Vôlei" → "volei", "Futebol" → "futebol" (é assim que fica guardado no banco)
  function chaveDaQuadra(texto) {
    return limpar(texto).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").split(" ")[0] || "futebol";
  }

  function nomeDaQuadra(chave) {
    return { futebol: "Futebol", volei: "Vôlei" }[chave] || limpar(chave);
  }

  function hoje() {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
})();

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Arena do Vilson</title>
  <link rel="stylesheet" href="estilo.css">
  <script src="banco.js"></script>
  <script>const API = "https://tonezacascaes-efe85-default-rtdb.firebaseio.com/arena-vilson/reservas.json";</script>
</head>
<body>

  <h1>Arena do Vilson</h1>
  <p>Reserve seu horário sem depender do grupo do WhatsApp</p>

  <input id="nome" placeholder="Seu nome">

  <select id="quadra">
    <option>Futebol</option>
    <option>Vôlei</option>
  </select>

  <input id="data" type="date">

  <select id="horario">
    <option>18:00</option>
    <option>19:00</option>
    <option>20:00</option>
    <option>21:00</option>
  </select>

  <button onclick="reservar()">Reservar</button>

  <ul id="lista"></ul>

  <script>
    async function reservar() {
      let reserva = {
        nome: document.getElementById("nome").value,
        quadra: document.getElementById("quadra").value,
        data: document.getElementById("data").value,
        horario: document.getElementById("horario").value
      };

      if (reserva.nome === "" || reserva.data === "") {
        alert("Preencha seu nome e a data!");
        return;
      }

      let lista = await fetch(API, "GET");
      let ocupado = lista.find(r =>
        r.quadra === reserva.quadra && r.data === reserva.data && r.horario === reserva.horario);
      if (ocupado) {
        alert("Esse horário já é de " + ocupado.nome);
        return;
      }

      await fetch(API, "POST", reserva);
      alert("✅ Reserva enviada! Olhem o projetor 👀");
    }

    async function carregar() {
      let lista = await fetch(API, "GET");

      let html = "";
      for (let r of lista) {
        html += "<li>" + r.nome + " · " + r.quadra + " · " + r.data + " · " + r.horario + "</li>";
      }
      document.getElementById("lista").innerHTML = html;
    }

    carregar();
    setInterval(carregar, 2000);
  </script>

</body>
</html>

  });

  // ---------- rodar ----------
  // estilo.css e banco.js viram "arquivos" de verdade (data URL), na MESMA linha,
  // para os números de linha do erro baterem com o editor.
  var URL_CSS = "data:text/css;charset=utf-8," + encodeURIComponent(CSS);
  var URL_BANCO = "data:text/javascript;charset=utf-8," + encodeURIComponent(BANCO);
  var GUARDA = "<script>window.onerror=function(m,s,l){try{parent.mostrarErro(m,(s===''||/srcdoc/.test(s))?l:0)}catch(e){}return false};" +
    "window.addEventListener('unhandledrejection',function(e){try{var r=e.reason,m=/srcdoc:(\\d+):\\d+/.exec((r&&r.stack)||'');parent.mostrarErro((r&&(r.message||r))||'erro',m?Number(m[1]):0)}catch(x){}});<\/script>";

  function montar(c) {
    c = c.replace(/(<link\b[^>]*?\bhref\s*=\s*)(["'])(?:\.\/)?estilo\.css\2/gi, function (m, a, q) { return a + q + URL_CSS + q; });
    c = c.replace(/(<script\b[^>]*?\bsrc\s*=\s*)(["'])(?:\.\/)?banco\.js\2/gi, function (m, a, q) { return a + q + URL_BANCO + q; });
    var dt = c.match(/<!doctype[^>]*>/i);
    if (dt) { var i = dt.index + dt[0].length; return c.slice(0, i) + GUARDA + c.slice(i); }
    return GUARDA + c;
  }

  function rodar() {
    clearTimeout(timer);
    erroExecucao = null;
    iframe.srcdoc = montar(codigo());
    cm.performLint();
  }

  function traduzir(msg) {
    msg = String(msg || "").replace(/^Uncaught\s+/, "").replace(/^(TypeError|ReferenceError|SyntaxError|Error):\s*/, function (m) { return m; });
    var m;
    if ((m = msg.match(/ReferenceError: (\S+) is not defined/))) return "<b>" + m[1] + "</b> não existe. Erro de digitação? Maiúsculas e minúsculas fazem diferença.";
    if (/parameter 2 is not of type|Failed to execute 'fetch'/.test(msg)) return "Esse jeito de usar o fetch precisa do banco.js. Você colocou <b>&lt;script src=\"banco.js\"&gt;&lt;/script&gt;</b> no &lt;head&gt;?";
    if (/Failed to fetch|NetworkError|Load failed/.test(msg)) return "Não consegui falar com a API. Confira o endereço em <b>const API</b> e a internet.";
    if ((m = msg.match(/A API respondeu com erro (\d+)/))) return "A API recusou o pedido (erro " + m[1] + "). Confira se o endereço da API termina em <b>/reservas.json</b>.";
    if (/await is only valid/.test(msg)) return "Para usar <b>await</b>, a função precisa começar com <b>async</b>: async function ...";
    if (/is not iterable/.test(msg)) return "A lista não veio. Faltou o <b>await</b> antes do fetch?";
    if (/Unexpected end of input/.test(msg)) return "O código terminou antes da hora. Falta fechar alguma chave } ou parêntese ).";
    if (/missing \) after argument list/.test(msg)) return "Falta fechar um parêntese ).";
    if (/Invalid or unexpected token/.test(msg)) return "Tem um símbolo estranho. Confira se as aspas \" abrem e fecham.";
    if (/Unexpected (token|identifier|string|number)/.test(msg)) return "O computador não entendeu esta linha. Falta ou sobra vírgula, aspas, chave { } ou parêntese?";
    if ((m = msg.match(/Cannot (?:read|set) properties of null \(\w+ '(\w+)'\)/))) return "O código procurou um elemento que não existe (deu null antes do ." + m[1] + "). Confira se o <b>id</b> no HTML é igual ao do JavaScript.";
    if ((m = msg.match(/Cannot (?:read|set) properties of undefined \(\w+ '(\w+)'\)/))) return "Tentou usar <b>." + m[1] + "</b> em algo que não existe (undefined). Confira o nome do que vem antes do ponto.";
    if (/Cannot (read|set) propert/.test(msg)) return "O código tentou usar algo que não existe. Confira os nomes e os ids.";
    if (/is not a function/.test(msg)) return "Essa função não existe. Confira o nome (maiúsculas e minúsculas).";
    return msg.replace(/[<>&]/g, "");
  }
  window.mostrarErro = function (msg, linha) {
    if (erroExecucao) return;                      // só o primeiro erro de cada execução
    erroExecucao = { linha: linha || 0, msg: traduzir(msg), bruto: String(msg || "") };
    cm.performLint();
  };

  // ---------- conferir os passos ----------
  var FONTE_TESTE = "(" + testeNoApp.toString() + ")()";
  var testando = 0;
  function verificar() {
    if (testando && Date.now() - testando < 4000) return;
    var w = null, p;
    try { w = iframe.contentWindow; } catch (e) {}
    if (!w) return;
    try { p = w.eval(FONTE_TESTE); } catch (e) { desenharPassos({}); return; }
    testando = Date.now();
    Promise.resolve(p).then(desenharPassos, function () { desenharPassos({}); })
      .then(function () { testando = 0; });
  }

  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  function desenharPassos(r) {
    r = r || {};
    var falta = r.falta || {};
    var feitos = [!!r.p1, !!r.p2, !!r.p3, !!r.p4, !!r.p5, !!r.p6];
    var html = "", total = 0;
    PASSOS.forEach(function (p, i) {
      if (feitos[i] && !p.extra) total++;
      var f = falta["p" + p.n];
      var dica = (!feitos[i] && !p.extra && f && f.length && (i === 0 || feitos[i - 1])) ? '<span class="falta">falta: ' + esc(f.join(", ")) + "</span>" : "";
      html += '<li class="' + (feitos[i] ? "feito " : "") + (p.extra ? "extra" : "") + '">' +
        '<span class="status">' + (feitos[i] ? "✅" : p.extra ? "☆" : "⬜") + "</span>" +
        '<span class="titulo">' + (p.extra ? "" : p.n + ". ") + p.titulo + dica + "</span>" + "</li>";
    });
    document.getElementById("passos").innerHTML = html;
    var bonus = (feitos[4] ? 1 : 0) + (feitos[5] ? 1 : 0);
    document.getElementById("placar").textContent = total + "/" + PRINCIPAIS + " passos" + (bonus ? " + " + bonus + " bônus" : "");
    document.getElementById("barra-fill").style.width = (total / PRINCIPAIS * 100) + "%";
    var v = document.getElementById("vitoria");
    if (total < PRINCIPAIS) { v.hidden = true; v.dataset.fechado = ""; }
    else if (!v.dataset.fechado) v.hidden = false;
  }
  document.getElementById("vitoria").onclick = function () { this.hidden = true; this.dataset.fechado = "1"; };

  // ---------- botões ----------
  iframe.addEventListener("load", verificar);
  setInterval(verificar, 2500);
  document.getElementById("btn-rodar").onclick = rodar;
  document.getElementById("btn-reset").onclick = function () {
    if (!confirm("Apagar tudo e voltar ao começo?")) return;
    try { sessionStorage.removeItem(CHAVE); } catch (e) {}
    mostrarAba("index");
    docIndex.setValue(modoProfessor ? SOLUCAO : INICIAL);
    rodar();
  };

  // ---------- início ----------
  var modoApp = location.hash === "#app";
  var modoProfessor = location.hash === "#solucao" || modoApp;
  if (modoApp) document.body.className = "modo-app";
  var inicio = INICIAL;
  if (modoProfessor) {
    document.getElementById("modo-prof").hidden = false;
    inicio = SOLUCAO;
  } else {
    try { inicio = sessionStorage.getItem(CHAVE) || INICIAL; } catch (e) {}
  }
  docIndex.setValue(inicio);
  docIndex.clearHistory();
  desenharPassos({});
  rodar();
})();
</script>
</body>
</html>
